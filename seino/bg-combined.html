<title>連結背景素材プレビュー — SEINO AGENT</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;background:#f4f5f7;color:#1c2330;line-height:1.7}
  header{padding:22px 28px;background:#0e1e4c;color:#fff}
  header h1{font-size:18px;letter-spacing:.04em}
  header p{font-size:12.5px;opacity:.8;margin-top:4px}
  .wrap{max-width:1500px;margin:0 auto;padding:28px}
  .col{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .card{background:#fff;border:1px solid #e2dccf;border-radius:8px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.06)}
  .card h2{font-size:15px;padding:14px 18px;border-bottom:1px solid #eee}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;margin-left:8px;vertical-align:middle}
  .ok{background:#e6f4ea;color:#1b7a3d}.warn{background:#fdecec;color:#b9292f}
  .card img{display:block;width:100%}
  .note{font-size:12.5px;color:#4a5160;padding:12px 18px}
  @media(max-width:900px){.col{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>連結背景素材プレビュー</h1>
  <p>180°回転版を上に、オリジナル版を下に、白の空白なしで連結した縦長素材</p>
</header>
<div class="wrap">
  <div class="col">
    <div class="card">
      <h2>① 上下反転(鏡像)で連結<span class="tag ok">継ぎ目なし・推奨</span></h2>
      <div class="note">上=上下反転、下=オリジナル。接合面が完全な鏡像になり、中央の濃紺三角形が連続(菱形/X字)。継ぎ目の線が出ません。</div>
      <img src="assets/img/combined_mirror.webp" alt="seamless mirror combined">
    </div>
    <div class="card">
      <h2>② 180°回転を上に連結<span class="tag warn">中央に継ぎ目の線</span></h2>
      <div class="note">ご指定どおり「180°回転版(上)＋オリジナル(下)」。ただし180°は左右も反転するため接合面の三角形が揃わず、中央に段差・線が出ます。</div>
      <img src="assets/img/combined_180.webp" alt="180 rotated combined">
    </div>
  </div>
</div>
</body>
</html>
