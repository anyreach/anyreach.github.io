<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-label="SEINO AGENT">
  <defs>
    <style>
      .red { fill: #d7282f; }
      .dark { fill: #1a2238; }
      .red-stroke { fill: none; stroke: #d7282f; stroke-width: 8; stroke-linecap: round; }
      .seino-text { font-family: 'Arial Black', 'Hiragino Sans', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- Stylized S with motion lines -->
  <g transform="translate(100, 70)">
    <!-- Left motion lines -->
    <line class="red-stroke" x1="-70" y1="-25" x2="-30" y2="-25"/>
    <line class="red-stroke" x1="-75" y1="-5"  x2="-25" y2="-5"/>
    <line class="red-stroke" x1="-70" y1="15"  x2="-30" y2="15"/>
    <line class="red-stroke" x1="-60" y1="35"  x2="-30" y2="35"/>

    <!-- Right motion lines -->
    <line class="red-stroke" x1="30" y1="-35" x2="60" y2="-35"/>
    <line class="red-stroke" x1="30" y1="-15" x2="70" y2="-15"/>
    <line class="red-stroke" x1="30" y1="5"   x2="75" y2="5"/>
    <line class="red-stroke" x1="30" y1="25"  x2="65" y2="25"/>

    <!-- The S shape -->
    <path class="red" d="
      M -30 -45
      C -30 -65, 30 -65, 30 -45
      C 30 -30, 20 -22, 0 -18
      C -20 -14, -30 -6, -30 10
      C -30 30, 30 30, 30 10
      L 30 -8
      L 10 -8
      L 10 12
      C 10 18, -10 18, -10 12
      C -10 4, -2 0, 18 -4
      C 38 -8, 50 -20, 50 -45
      C 50 -85, -50 -85, -50 -45
      L -50 -25
      L -30 -25
      Z
    "/>
  </g>

  <!-- Dark text band -->
  <rect class="dark" x="20" y="135" width="160" height="55"/>
  <text class="red seino-text" x="100" y="159" text-anchor="middle" font-size="22" letter-spacing="2.5">SEINO</text>
  <text class="red seino-text" x="100" y="183" text-anchor="middle" font-size="22" letter-spacing="3.5">AGENT</text>
</svg>
