<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice">
  <!-- Base navy fill -->
  <rect width="1000" height="560" fill="#0e1e4c"/>

  <!-- Triangular polygons radiating from upper-center, various blue shades -->
  <!-- All polygons share the apex point near (470, 320) -->

  <!-- Far left: light blue -->
  <polygon points="0,0 0,300 470,320" fill="#2150a6"/>

  <!-- Left dark navy triangle -->
  <polygon points="0,0 260,0 470,320 0,170" fill="#102a72"/>

  <!-- Center-top dark navy -->
  <polygon points="260,0 470,0 470,320" fill="#03133e"/>

  <!-- Right-of-center medium blue -->
  <polygon points="470,0 700,0 470,320" fill="#13388a"/>

  <!-- Far-right top triangles -->
  <polygon points="700,0 1000,0 1000,260 470,320" fill="#0d2664"/>

  <!-- Right-middle deep blue -->
  <polygon points="1000,0 1000,260 470,320" fill="#152e6f"/>

  <!-- Bottom-left medium blue triangle -->
  <polygon points="0,170 0,560 470,320" fill="#1a3f8a"/>

  <!-- Lower-left dark blue under apex -->
  <polygon points="0,560 470,320 380,560" fill="#0d2660"/>

  <!-- Center-bottom medium-light blue -->
  <polygon points="470,320 380,560 700,560" fill="#274ea0"/>

  <!-- Bottom-right medium blue -->
  <polygon points="470,320 700,560 1000,560" fill="#1a3a82"/>

  <!-- Right-bottom dark blue -->
  <polygon points="1000,260 1000,560 470,320" fill="#10286a"/>
</svg>
